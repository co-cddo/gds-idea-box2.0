[project]
name = "box2"
version = "0.1.0"
description = "GDS IDEA Box 2.0 - AI tools for private office workflows"
readme = "README.md"
authors = [
    { name = "Alex Pop", email = "alexandra.pop@digital.cabinet-office.gov.uk" },
    { name = "Jose Orjales", email = "jose.orjales@digital.cabinet-office.gov.uk" },
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.20.0",
    "boto3>=1.40.63",
    "httpx>=0.28.0",
    "pandas>=2.3.3",
    "pydantic-ai>=1.9.1",
    "pypdf>=5.3.0",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box2"]

[dependency-groups]
dev = [
    "fuzzywuzzy>=0.18.0",
    "ipython>=9.6.0",
    "pytest>=9.0.2",
    "pytest-check>=2.6.2",
    "python-levenshtein>=0.27.3",
    "ruff>=0.14.14",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests that require AWS credentials and call live LLM",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]


[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude files or directories
exclude = [
    ".git",
    "__pypackages__",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule sets by their prefix
# E (Pycodestyle errors), F (Pyflakes), I (isort), B (Bugbear), UP (Pyupgrade), etc.
select = ["E", "F", "I", "B", "UP", "N", "A", "PT"]
# E501 disabled: ruff format handles code line length; remaining violations are
# string literals (LLM prompts, test data) that shouldn't be wrapped.
ignore = ["E501"]

# Configure the 'isort' rule set (I)
[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true