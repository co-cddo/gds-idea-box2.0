[project]
name = "box2"
dynamic = ["version"]
description = "GDS IDEA Box 2.0 - AI tools for private office workflows"
readme = "README.md"
authors = [
    { name = "Alex Pop", email = "alexandra.pop@digital.cabinet-office.gov.uk" },
    { name = "Jose Orjales", email = "jose.orjales@digital.cabinet-office.gov.uk" },
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.57",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
sharepoint = [
    "azure-identity>=1.25.3",
]
pipeline = [
    "pandas>=3.0.5",
    "pydantic-ai>=1.56.0",
    "pypdf>=6.14.2",
    "python-docx>=1.1.2",
]
receiver = [
    "azure-identity>=1.25.3",
    "fastapi>=0.140.7",
    "mangum>=0.19.0",
    "pydantic-ai>=1.56.0",
    "pyngrok>=7.2.0",
    "uvicorn>=0.51.0",
]
all = [
    "box2[sharepoint,pipeline,receiver]",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/box2/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/box2"]


[tool.gds-idea-app-kit]
framework = "python"
app_name = "box2"
tool_version = "0.5.4"
python_version = "3.13"

[tool.gds-idea-app-kit.files]
LICENCE = "sha256:e6356e2315581a3c231279cbc7ca90111c55e9c10625b17a935359c800a3553a"
".github/CODEOWNERS" = "sha256:464aa53eb8be8c9b61185674b4dabec6cacbafa904aa48b46facdcd9a18e1fc5"
".github/workflows/ci.yml" = "sha256:baed13493483724c4f2cdec0df9d378dfc2f8df8a0f01bfb65a108c9d7af3d29"
".github/dependabot.yml" = "sha256:8472c537c3808394c9200ac7f67e61ce565981583c6f7f381339f1df255fb318"
".pre-commit-config.yaml" = "sha256:376617ea56a3e3b6691e423e33c1faeff299e95205c54208bbd3b3a5c619bd57"
".github/workflows/release.yml" = "sha256:d2c22e66042f7f7fca4dc1066ff3ffaa4303df9c8a57953684a0a927731b1fe6"
[dependency-groups]
dev = [
    "fuzzywuzzy>=0.18.0",
    "ipython>=9.15.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-check>=2.8.0",
    "python-dotenv>=1.2.2",
    "python-levenshtein>=0.27.3",
    "ruff>=0.16.0",
]


[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not eval",
]
markers = [
    "integration: tests that require AWS credentials and call live LLM",
    "webhook: tests that require a public notification URL for Microsoft Graph webhooks",
    "eval: LLM output quality evals -- excluded by default, run with: uv run pytest -m eval",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]


[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude files or directories
exclude = [
    ".git",
    "__pypackages__",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "src/box2/_version.py",
]

[tool.ruff.lint]
# Enable specific rule sets by their prefix
# E (Pycodestyle errors), F (Pyflakes), I (isort), B (Bugbear), UP (Pyupgrade), etc.
select = ["E", "F", "I", "B", "UP", "N", "A", "PT"]
# E501 disabled: ruff format handles code line length; remaining violations are
# string literals (LLM prompts, test data) that shouldn't be wrapped.
ignore = ["E501"]

# Configure the 'isort' rule set (I)
[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
